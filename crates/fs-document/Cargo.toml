[package]
name = "fs-document"
description = "Document model of FreeSynergy: rope text with stand-off mark layers, blocks, Markdown import and export, history. A plain library: no store, no GUI. Built with help from Claude (AI)"
readme = "README.md"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
# repository.workspace = true  # set after the repository exists


[dependencies]
ropey = "1.6"
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
pulldown-cmark = { version = "0.13", default-features = false }
similar = "2"
serde_json = "1"
thiserror = "2"
unicode-segmentation = "1"

[dev-dependencies]
similar = "2"
proptest = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
